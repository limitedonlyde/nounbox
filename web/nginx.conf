server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # заголовок Server раскрывает версию nginx — не нужен
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # имена ассетов содержат хеш содержимого — можно кешировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # ленивое разрешение имени через встроенный DNS Docker: иначе nginx
        # падает при старте, если api ещё не поднялся, и держит устаревший IP
        # после его перезапуска
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # загрузка документов: PDF и ZIP бывают крупными
        client_max_body_size 2g;
        # экспорт датасета: ZIP собирается на лету, буферизовать его незачем,
        # а сборка большого проекта легко выходит за минуту
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA: маршруты вида /projects/<id>/review/<id> обслуживает роутер в браузере
    location / {
        try_files $uri $uri/ /index.html;
    }
}
