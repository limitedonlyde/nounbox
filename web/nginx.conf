server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # the Server header leaks the nginx version — not needed
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # asset names contain a content hash — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # lazy name resolution through Docker's built-in DNS: otherwise nginx
        # fails to start when api is not up yet, and holds on to a stale IP
        # after api restarts
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # document uploads: PDFs and ZIPs can be large
        client_max_body_size 2g;
        # dataset export: the ZIP is built on the fly, no point buffering it,
        # and building a large project easily takes more than a minute
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA: routes like /projects/<id>/review/<id> belong to the browser router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
