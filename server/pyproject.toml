[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nounbox-server"
version = "0.1.0"
description = "Nounbox backend — self-hosted auto-labeling for object detection"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "pypdfium2>=4.30",
    "pillow-heif>=0.16",
    "numpy>=1.26",
    "cryptography>=42",
    # programmatic deploy of the GPU recipe into the user's Modal account
    "modal>=1.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.services",
    "app.workers",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
