# Config for test runs started from the repository root — `pytest labelers`,
# `pytest deploy/modal/tests`. The server suite is run with `cd server` and
# takes its settings from server/pyproject.toml instead; this file is not
# consulted there.
#
# import-mode=importlib is required, not a preference. Every plugin keeps its
# tests next to itself, so labelers/consensus/tests/test_labeler.py,
# labelers/llmdet/tests/test_labeler.py and labelers/rapidocr/tests/
# test_labeler.py all exist, and none of those directories is a package. Under
# the default prepend mode pytest derives the module name from the basename
# alone, the second file to be collected collides with the first, and the run
# dies with "import file mismatch" before a single test executes. importlib
# mode gives each file its own module identity, so the layout works.
[pytest]
addopts = --import-mode=importlib
markers =
    slow: runs the real model (weights, seconds per image); run with: pytest -m slow
