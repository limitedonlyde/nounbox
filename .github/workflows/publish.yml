# Build and publish images to the GitHub Container Registry.
#
# What is published:
#   ghcr.io/<owner>/nounbox-server — api and worker (a single image, they
#                                        differ only in the compose commands)
#   ghcr.io/<owner>/nounbox-web    — static bundle behind nginx (prod target)
#
# docker-compose.ghcr.yml wires these images in: the user does not have to build
# anything locally — just download the compose file and bring the stack up.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (drop arm64 for a quick test build)"
        default: linux/amd64,linux/arm64
        type: string
      push:
        description: "Push to GHCR. Off by default for manual runs: a quick
          amd64-only build must not overwrite the multi-arch :latest"
        default: false
        type: boolean

# GITHUB_TOKEN: pushing packages and reading sources, nothing else
permissions:
  contents: read
  packages: write

concurrency:
  # builds of one ref do not stack up on each other; for tags cancelling is
  # forbidden — a release that has started must make it all the way through
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # no green tests, no image in GHCR
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    # a cold server build under QEMU/arm64 takes tens of minutes, so leave room
    timeout-minutes: 150
    strategy:
      # web must not stay unpublished just because server failed
      fail-fast: false
      matrix:
        include:
          # api and worker are built from the same Dockerfile with the same
          # arguments, i.e. they match byte for byte. Publishing one image
          # rules out api and worker drifting apart in version on a shared DB.
          - image: server
            context: .
            dockerfile: server/Dockerfile
            target: ""
            description: Nounbox backend (FastAPI api + arq worker)
          - image: web
            context: ./web
            dockerfile: web/Dockerfile
            target: prod
            description: Nounbox review UI (static bundle behind nginx)

    steps:
      - uses: actions/checkout@v4

      # GHCR does not accept uppercase letters in an image name, and the repo
      # owner may be spelled any way at all (MyOrg) — so lowercase it
      - name: Resolve image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # arm64 emulation on an amd64 runner. On a public repository it is cheaper
      # and faster to build arm64 natively: split the matrix by platform onto
      # runs-on: ubuntu-24.04-arm and merge the manifests — then drop this step.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.ns.outputs.owner }}/nounbox-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
          labels: |
            org.opencontainers.image.title=nounbox-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # empty for server: its Dockerfile has a single stage
          target: ${{ matrix.target }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # layer cache across runs. A per-image scope is mandatory: with a
          # shared one, server and web would evict each other's cache. GitHub's
          # limit is 10 GB per repo; on eviction a build simply starts from scratch.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Report published tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### nounbox-${{ matrix.image }}"
            echo '```'
            echo "$TAGS"
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
