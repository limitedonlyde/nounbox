# Quality gate before images are published: publish.yml waits on this workflow,
# otherwise a typo in an import ships to :latest and breaks the install for
# everyone who runs from the prebuilt images.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install server and plugins
        # -e for the server too, not just the plugins: modal_deploy.recipe_path()
        # finds deploy/modal by walking up from app/services/modal_deploy.py, and
        # a non-editable install puts that file in site-packages, where walking
        # up leads nowhere near the recipes.
        # torch from the CPU wheel: the default one drags in gigabytes of CUDA,
        # and the engine tests never run the models (they are marked slow)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e ./sdk -e ./labelers/owlv2 -e ./labelers/llmdet \
            -e ./labelers/rapidocr -e ./labelers/vlm -e ./labelers/http \
            -e ./labelers/consensus -e ./server
          pip uninstall -y opencv-python opencv-contrib-python || true
          pip install "opencv-python-headless>=4.10"
          pip install pytest pytest-asyncio httpx aiosqlite

      - name: Server tests
        working-directory: server
        run: pytest tests -q

      - name: Labeler tests
        run: pytest labelers -q -m "not slow"

      - name: Recipe tests
        # the recipes are deployed verbatim into the user's Modal account, and
        # the detection one carries a copy of the CPU engine's box math — these
        # tests are what keeps the copy honest
        run: pip install modal && pytest deploy/modal/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type-check and build
        working-directory: web
        run: npm run build
