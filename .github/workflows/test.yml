# Гейт качества перед публикацией образов: publish.yml ждёт этот workflow,
# иначе опечатка в импорте уезжает в :latest и ломает установку всем, кто
# запускается из готовых образов.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install server and plugins
        # torch — CPU-колесом: дефолтное тянет CUDA на гигабайты, а тесты
        # движков не запускают модели (они помечены slow)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e ./sdk -e ./labelers/owlv2 -e ./labelers/llmdet \
            -e ./labelers/rapidocr -e ./labelers/vlm -e ./labelers/http \
            -e ./labelers/consensus ./server
          pip uninstall -y opencv-python opencv-contrib-python || true
          pip install "opencv-python-headless>=4.10"
          pip install pytest pytest-asyncio httpx aiosqlite

      - name: Server tests
        working-directory: server
        run: pytest tests -q

      - name: Labeler tests
        run: pytest labelers -q -m "not slow"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type-check and build
        working-directory: web
        run: npm run build
