[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nounbox-labeler-paddleocr"
version = "0.1.0"
description = "PaddleOCR labeler plugin for Nounbox (detection + recognition)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "nounbox-sdk",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.entry-points."nounbox.labelers"]
paddleocr = "nounbox_labeler_paddleocr:PaddleOCRLabeler"

[tool.setuptools.packages.find]
include = ["nounbox_labeler_paddleocr*"]
