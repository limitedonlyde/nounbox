[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nounbox-labeler-consensus"
version = "0.1.0"
description = "Consensus meta-labeler for Nounbox — real confidence from cross-engine agreement (IoU matching + text similarity)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "nounbox-sdk",
]

[project.entry-points."nounbox.labelers"]
consensus = "nounbox_labeler_consensus:ConsensusLabeler"

[tool.setuptools.packages.find]
include = ["nounbox_labeler_consensus*"]
