[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolabel-labeler-http"
version = "0.1.0"
description = "Generic HTTP labeler for AutoLabelUi — any engine behind a tiny HTTP convention (Modal, RunPod, custom)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "autolabelui-sdk",
    "httpx>=0.27",
]

[project.entry-points."autolabelui.labelers"]
http = "autolabel_labeler_http:HttpLabeler"
modal_gpu = "autolabel_labeler_http:ModalGpuLabeler"

[tool.setuptools.packages.find]
include = ["autolabel_labeler_http*"]
