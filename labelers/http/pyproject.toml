[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nounbox-labeler-http"
version = "0.1.0"
description = "Generic HTTP labeler for Nounbox — any engine behind a tiny HTTP convention (Modal, RunPod, custom)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "nounbox-sdk",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."nounbox.labelers"]
http = "nounbox_labeler_http:HttpLabeler"
modal_gpu = "nounbox_labeler_http:ModalGpuLabeler"
modal_gpu_detect = "nounbox_labeler_http:ModalGpuDetectLabeler"

[tool.setuptools.packages.find]
include = ["nounbox_labeler_http*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
