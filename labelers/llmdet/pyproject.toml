[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nounbox-labeler-llmdet"
version = "0.1.0"
description = "LLMDet labeler for Nounbox — open-vocabulary box detection on CPU (MM-Grounding-DINO, Apache-2.0), the accuracy mode next to OWLv2"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "nounbox-sdk",
    "transformers>=4.57",
    "torch>=2.2",
    "Pillow>=10.0",
]

[project.entry-points."nounbox.labelers"]
llmdet = "nounbox_labeler_llmdet:LLMDetLabeler"

[tool.setuptools.packages.find]
include = ["nounbox_labeler_llmdet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: runs the real model (0.7-1.6 GB of weights, seconds per photo); run: pytest -m slow",
]
