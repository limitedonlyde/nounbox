[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolabel-labeler-vlm"
version = "0.1.0"
description = "VLM labeler plugin for AutoLabelUi (any OpenAI-compatible endpoint: Ollama, vLLM, cloud)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "autolabelui-sdk",
    "openai>=1.40",
    "Pillow>=10.0",
]

[project.entry-points."autolabelui.labelers"]
vlm = "autolabel_labeler_vlm:VlmLabeler"

[tool.setuptools.packages.find]
include = ["autolabel_labeler_vlm*"]
