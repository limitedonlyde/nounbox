# Base file — the RELEASE configuration: prebuilt static assets behind nginx,
# no --reload and no source mounts.
#
#   prod:  docker compose -f docker-compose.yml up -d --build
#   dev:   docker compose up -d --build
#
# The second form automatically picks up docker-compose.override.yml, which
# brings back the Vite dev server, --reload and live code.
name: nounbox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autolabel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autolabel}
      POSTGRES_DB: ${POSTGRES_DB:-autolabel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autolabel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autolabel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-autolabel123}
    ports:
      # The browser opens presigned image links DIRECTLY: a SigV4 signature
      # covers the host and path, so MinIO cannot be proxied under a prefix —
      # the signature would stop matching. When not deploying on localhost,
      # point S3_PUBLIC_ENDPOINT_URL at an address the browser can reach.
      - "127.0.0.1:9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # local PaddleOCR (gigabytes) — opt-in: WITH_PADDLE=1 docker compose build
        WITH_PADDLE: ${WITH_PADDLE:-0}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autolabel}:${POSTGRES_PASSWORD:-autolabel}@postgres:5432/${POSTGRES_DB:-autolabel}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://host.docker.internal:11434/v1}
      VLM_API_KEY: ${VLM_API_KEY:-ollama}
      VLM_MODEL: ${VLM_MODEL:-qwen2.5vl:7b}
    # no port published: the browser reaches the API through nginx (/api)
    volumes:
      - appdata:/data  # settings encryption key (shared with the worker)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # default: a light image without paddlepaddle/paddleocr — heavy
        # inference goes to Modal ("Connect GPU" button), rapidocr runs locally
        WITH_PADDLE: ${WITH_PADDLE:-0}
    command: arq app.workers.tasks.WorkerSettings
    extra_hosts:
      # reach Ollama/other host services (Linux; built in on Mac/Windows)
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment: *backend_env
    volumes:
      - appdata:/data  # settings encryption key (shared with api)
      - ocr-models:/root/.cache  # engine weight cache (owlv2 ~620MB), downloaded once
      - paddleocr-data:/root/.paddlex  # PaddleOCR model cache (when WITH_PADDLE=1)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: prod
    # explicit tag: dev and prod targets share one Dockerfile, and without
    # distinct names switching modes would silently reuse the other's image
    image: nounbox-web:prod
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  appdata:
  ocr-models:
  paddleocr-data:
