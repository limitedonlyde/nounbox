[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolabelui-sdk"
version = "0.1.0"
description = "Plugin contract for AutoLabelUi labelers (OCR autolabeling platform)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }

[tool.setuptools.packages.find]
include = ["autolabelui_sdk*"]
